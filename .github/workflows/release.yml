name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versions-Tag ohne führendes v (z. B. 1.0.0). Leer = Timestamp."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
            if [[ -z "$V" ]]; then
              V="0.0.0-ci.$(date -u +%Y%m%d%H%M%S)"
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            V="${TAG#v}"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Linux-Installer bauen
        env:
          STUDIO_VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/linux/build-installer.sh
          ./packaging/linux/build-installer.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Linux-Installer
          path: dist/Studio-Linux-Installer.sh

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: macOS-Installer bauen
        env:
          STUDIO_VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/macos/build-installer.sh
          ./packaging/macos/build-installer.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-macOS-Installer
          path: dist/Studio-macOS-Installer.zip

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows-Installer bauen
        env:
          STUDIO_VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 -OutDir dist -Version $env:STUDIO_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Windows-Setup
          path: |
            dist/Studio-Windows-Setup.exe
            dist/Studio-Windows-Installer.zip
          if-no-files-found: error

  release:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assets sammeln
        run: |
          mkdir -p dist
          cp artifacts/Studio-Linux-Installer/Studio-Linux-Installer.sh dist/
          cp artifacts/Studio-macOS-Installer/Studio-macOS-Installer.zip dist/
          if [[ -f artifacts/Studio-Windows-Setup/Studio-Windows-Setup.exe ]]; then
            cp artifacts/Studio-Windows-Setup/Studio-Windows-Setup.exe dist/
          else
            # Fallback, falls Inno fehlschlägt: ZIP als Windows-Asset
            cp artifacts/Studio-Windows-Setup/Studio-Windows-Installer.zip dist/Studio-Windows-Setup.zip
          fi
          ls -lh dist
      - name: Release erzeugen / aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## Studio ${VERSION}"
            echo
            echo "Ein Installer pro Betriebssystem. Beim Start HD60, Wave Link Linux (Spurwerk) oder beides wählen."
            echo
            echo "| OS | Datei |"
            echo "| --- | --- |"
            echo "| Linux | \`Studio-Linux-Installer.sh\` |"
            echo "| macOS | \`Studio-macOS-Installer.zip\` |"
            echo "| Windows | \`Studio-Windows-Setup.exe\` (unsigned) |"
            echo
            echo "**Hinweis:** Beide Programme laufen vollständig unter **Nobara/Fedora (Linux)**."
            echo "macOS- und Windows-Installer legen ein Dateipaket ab (Übertragen auf Linux / VM / WSL)."
            echo
            echo "### Linux"
            echo '```bash'
            echo "chmod +x Studio-Linux-Installer.sh"
            echo "./Studio-Linux-Installer.sh"
            echo '```'
            echo
            echo "### macOS"
            echo "ZIP entpacken → Rechtsklick auf \`Studio-Installer.command\` → Öffnen."
            echo
            echo "### Windows"
            echo "\`Studio-Windows-Setup.exe\` starten. SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“."
          } > "$NOTES"

          # Tag bei workflow_dispatch anlegen, falls nötig
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Studio $VERSION"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --title "Studio ${VERSION}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
