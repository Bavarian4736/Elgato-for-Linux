# WaveLink Linux — virtuelle Spuren (PipeWire)
# Wird nach ~/.config/pipewire/pipewire.conf.d/ installiert.
# Wichtig: factory = adapter (nicht spa-node-factory), sonst fehlen Stereo-/Monitor-Ports.

context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "wavelink_system"
            node.description = "WaveLink System"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "wavelink_music"
            node.description = "WaveLink Music"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
